<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Skill-Desk updates</title><style>body{font:15px system-ui;color:#242624;background:#faf9f6;margin:32px}h1{font-size:27px}p{line-height:1.6}button{font:inherit;padding:10px 14px;border:1px solid #c7cbc2;border-radius:5px;background:white;cursor:pointer}button.primary{background:#ad4529;color:white;border-color:#ad4529}button:disabled{opacity:.5;cursor:default}pre{white-space:pre-wrap;max-height:180px;overflow:auto;font:13px/1.5 system-ui}progress{width:100%}#message{overflow-wrap:anywhere}#current{color:#686d68}.actions{display:flex;gap:10px}</style></head><body><h1>Skill-Desk updates</h1><p id="current"></p><p id="message" role="status">Checking update status…</p><progress hidden id="progress"></progress><pre id="notes"></pre><div class="actions"><button id="check">Check for updates</button><button class="primary" id="install" hidden>Update and restart</button></div><p>Your skills and CLI accounts stay on this computer. Finish or discard skill previews before installing an update.</p><script>
const invoke=window.__TAURI__.core.invoke;
const el=id=>document.getElementById(id);
async function refresh(){try{const s=await invoke('update_status');el('current').textContent='Installed version '+s.currentVersion;const busy=['checking','downloading','waiting','installing'].includes(s.phase);el('check').disabled=busy;el('install').hidden=s.phase!=='available';el('message').textContent=({idle:'Check for a new release.',checking:'Checking GitHub for updates…',available:'Version '+s.version+' is available.',current:'You are up to date.',downloading:'Downloading and verifying update…',waiting:s.message,installing:'Installing update. Skill-Desk will restart.',error:s.message})[s.phase]||'';el('notes').textContent=s.notes||'';el('progress').hidden=s.phase!=='downloading';if(s.total){el('progress').max=s.total;el('progress').value=s.downloaded;}else el('progress').removeAttribute('value');}catch(e){el('message').textContent=String(e);}}
el('check').onclick=async()=>{el('check').disabled=true;try{await invoke('update_check');}catch(e){el('message').textContent=String(e);}refresh();};el('install').onclick=async()=>{el('install').disabled=true;try{await invoke('update_install');}catch(e){el('message').textContent=String(e);}finally{el('install').disabled=false;refresh();}};
refresh();setInterval(refresh,700);
</script></body></html>

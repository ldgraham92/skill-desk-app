<script>
/* Run in the head, before paint. No remote assets or background polling. */
(()=>{
 const key='skill-desk-theme',root=document.documentElement;
 let theme='dark';try{theme=localStorage.getItem(key)==='light'?'light':'dark';}catch{}
 if(['dark','light'].includes(window.skillDeskTheme))theme=window.skillDeskTheme;
 function apply(value){theme=value;root.dataset.theme=theme;document.querySelector('meta[name="color-scheme"]')?.setAttribute('content',theme);document.querySelectorAll('[data-theme-toggle]').forEach(button=>{button.setAttribute('aria-label','Switch to '+(theme==='dark'?'light':'dark')+' mode');button.title=button.getAttribute('aria-label');button.setAttribute('aria-pressed',String(theme==='dark'));button.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+(theme==='dark'?'<path d="M20 14a8 8 0 0 1-10-10 8 8 0 1 0 10 10Z"/>':'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>')+'</svg><span>'+ (theme==='dark'?'Dark':'Light')+'</span>';});}
 apply(theme);
 document.addEventListener('DOMContentLoaded',()=>apply(theme));
 document.addEventListener('click',event=>{if(!event.target.closest('[data-theme-toggle]'))return;apply(theme==='dark'?'light':'dark');try{localStorage.setItem(key,theme);}catch{}window.skillDeskSaveTheme?.(theme);});
 window.addEventListener('storage',event=>{if(event.key===key)apply(event.newValue==='light'?'light':'dark');});
})();
</script>

</head><body data-ui="app"><a class="skip" href="#content">Skip to content</a><div class="shell"><aside class="sidebar"><div class="brand"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><rect x="24" y="24" width="976" height="976" rx="210" fill="#272c28"/><path d="M256 280h512M256 440h352M256 600h512M256 760h352" fill="none" stroke="#f8f7f2" stroke-width="48"/></svg> Skill-Desk</div><p class="subtitle">YOUR GLOBAL SKILLS</p><nav class="nav" aria-label="Guide pages" id="mainnav"><button data-view="overview"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8M5 10v11h5v-7h4v7h5V10"/></svg>Overview</button><button data-view="all" class="active"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 8h8M8 12h8M8 16h5"/></svg>All skills</button><button data-view="reference"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 3h12l4 4v14H4zM8 11h8M8 15h5"/></svg>Quick reference</button><button data-view="saved"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Saved</button></nav><div class="workflow"><p class="eyebrow">Workflow</p><nav class="nav" aria-label="Workflow filters" id="categories"></nav></div><footer>Open the desktop app to load your skills.</footer></aside><main><header class="topbar"><div class="searchwrap"><span aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg></span><input type="search" id="search" aria-label="Find a skill or describe the job" placeholder="Find a skill or describe the job..."><kbd aria-hidden="true">/</kbd></div><button class="button" id="print">Print guide</button><button class="button" data-theme-toggle aria-label="Switch to light mode">Dark</button></header><div id="content" tabindex="-1"></div></main></div><div id="toast" role="status" aria-live="polite"></div><div class="print-only" id="printguide"></div>
<script id="skill-data" type="application/json">[]</script>
<script>
'use strict';
const skills=JSON.parse(document.getElementById('skill-data').textContent), $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let saved=[];try{saved=JSON.parse(localStorage.getItem('skill-desk-saved')||'[]');if(!Array.isArray(saved))saved=[]}catch{}let view='all',category='',selected=skills.some(s=>s.id===location.hash.slice(1))?location.hash.slice(1):'diagnosing-bugs',query='',timer;
const cats=['Understand','Design','Build','Verify','Write','Continue'];
$('#categories').innerHTML=cats.map(c=>`<button data-category="${c}">${c}</button>`).join('');
const list=a=>`<ul>${(a||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
function toast(t){$('#toast').textContent=t;clearTimeout(timer);timer=setTimeout(()=>$('#toast').textContent='',3200)}
function filtered(){let terms=query.toLowerCase().trim().split(/\s+/).filter(Boolean);return skills.filter(s=>(!category||s.category===category)&&(view!=='saved'||saved.includes(s.id))&&terms.every(t=>JSON.stringify(s).toLowerCase().includes(t)))}
function select(id){selected=id;try{history.replaceState(null,'','#'+id)}catch{location.hash=id}render();$('.detail')?.scrollIntoView({block:'start'})}
function detail(s){return `<article class="detail"><div class="detail-top"><span class="eyebrow">${esc(s.category)} / SKILL</span><span class="source">${esc(s.source)}</span></div><h1>${esc(s.id)}</h1><p class="lead">${esc(s.summary)}</p><div><span class="tag">${esc(s.invocationLabel)}</span><button class="button" id="save" aria-pressed="${saved.includes(s.id)}">${saved.includes(s.id)?'Saved ✓':'Save skill'}</button></div><div class="columns"><section><h2>When to use</h2>${list(s.when)}</section><section><h2>What you'll notice</h2>${list(s.notice)}</section></div><div class="prompt"><div class="prompt-head"><span>Try this in Codex</span><button class="button primary" data-copy="${esc(s.id)}">Copy prompt</button></div><pre>${esc(skillPrompt(s))}</pre></div><div class="columns"><section><h2>What it does</h2><ol>${(s.steps||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></section><section><h2>What you get</h2><p>${esc(s.output)}</p><h3>How it starts</h3><p>${esc(s.invocationText)}</p></section></div><div class="bottom"><h2>Limits to keep in mind</h2>${list(s.limits)}<details><summary>Source and local adaptations</summary><p>${esc(s.adaptation)}</p><div class="source-links"><a href="${esc(s.sourceUrl)}" target="_blank" rel="noopener">Read the pinned original</a> · <a href="${esc(s.localUrl)}">Open bundled instructions</a></div></details><h3>Related skills</h3><div class="related">${(s.related||[]).filter(id=>skills.some(x=>x.id===id)).map(id=>`<button class="button" data-skill="${esc(id)}">${esc(id)}</button>`).join('')}</div></div></article>`}
function skillName(s){return s.name||s.id}
function promptProvider(s){return typeof harnessFilter!=='undefined'&&harnessFilter!=='all'?harnessFilter:(s.harnesses||['codex'])[0]}
function skillInvocation(s){return (promptProvider(s)==='claude'?'/':'$')+skillName(s)}
function skillPrompt(s){const name=skillName(s);return String(s.prompt||'').replace(new RegExp('(^|[\\s`(])[$/]'+name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?=$|[\\s`,;!?)])','g'),(_,before)=>before+skillInvocation(s))}
function overview(){return `<div class="page"><h1>Your global skills</h1><p class="lead">Browse installed skills in the desktop app.</p><p>This template contains no bundled personal skills. Open Skill-Desk to load your local library.</p></div>`}
function reference(){return `<div class="page"><span class="eyebrow">Keep this beside your task</span><h1>Quick reference</h1><p class="lead">Choose by the job in front of you. Open an entry for a ready-to-copy example.</p><table class="reference"><thead><tr><th>Invoke</th><th>Use it to</th><th>Starts</th></tr></thead><tbody>${filtered().map(s=>`<tr><td><button class="text-link" data-skill="${esc(s.id)}"><code>${esc(skillInvocation(s))}</code></button></td><td>${esc(s.summary)}</td><td>${esc(s.invocationLabel)}</td></tr>`).join('')}</tbody></table>${filtered().length?'':'<p>No matching skills. Try a shorter search.</p>'}<p class="check">Print guide includes all installed skills and their example prompts, regardless of filters.</p></div>`}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view&&!category));document.querySelectorAll('[data-category]').forEach(b=>b.classList.toggle('active',b.dataset.category===category));if(view==='overview'){$('#content').innerHTML=overview();return}if(view==='reference'){$('#content').innerHTML=reference();return}let matches=filtered();if(!matches.some(s=>s.id===selected)&&matches.length)selected=matches[0].id;let s=matches.find(s=>s.id===selected);$('#content').innerHTML=`<div class="workspace"><section class="skill-list" aria-label="Skills"><div class="list-head"><strong>${esc(category||(view==='saved'?'Saved skills':'All skills'))}</strong><span>${matches.length} skills</span></div>${matches.map(x=>`<button class="skill-row ${x.id===selected?'active':''}" data-skill="${esc(x.id)}" aria-pressed="${x.id===selected}"><span class="row-name">${esc(x.id)}</span><span class="row-summary">${esc(x.summary)}</span><span class="row-meta">${esc(x.source)} · ${esc(x.category)}</span></button>`).join('')||'<p class="empty">No skills here yet. Try another search or save a skill from the full list.</p>'}</section>${s?detail(s):'<div class="detail"><h1>No matches</h1><p class="lead">Clear your search or choose All skills.</p><button class="button" id="reset">Show all skills</button></div>'}</div>`}
async function copy(id){let text=skillPrompt(skills.find(s=>s.id===id));try{if(!navigator.clipboard)throw Error();await navigator.clipboard.writeText(text);toast('Prompt copied')}catch{let el=document.createElement('textarea');el.value=text;el.setAttribute('aria-label','Prompt to copy');el.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px';document.body.append(el);el.select();let ok=false;try{ok=document.execCommand('copy')}catch{}el.remove();if(ok)toast('Prompt copied');else{toast('Copy unavailable. Select the prompt text and copy it.');let p=document.querySelector('pre');if(p){let r=document.createRange();r.selectNodeContents(p);let sel=window.getSelection();sel.removeAllRanges();sel.addRange(r)}}}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;category='';query='';$('#search').value='';render()}else if(b.dataset.category){category=b.dataset.category;view='all';render()}else if(b.dataset.skill){let fromLink=!b.classList.contains('skill-row');if(fromLink){view='all';category='';query='';$('#search').value=''}select(b.dataset.skill);if(fromLink){let h=$('.detail h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true});h.scrollIntoView({block:'nearest'})}}}else if(b.dataset.copy)copy(b.dataset.copy);else if(b.id==='save'){saved=saved.includes(selected)?saved.filter(x=>x!==selected):[...saved,selected];let persisted=true;try{localStorage.setItem('skill-desk-saved',JSON.stringify(saved))}catch{persisted=false}render();$('#save')?.focus();toast(persisted?'Saved list updated':'Saved for this visit. Browser storage is unavailable.')}else if(b.id==='reset'){view='all';category='';query='';$('#search').value='';render()}else if(b.id==='print')window.print()});
$('#search').addEventListener('input',e=>{query=e.target.value;if(view==='overview')view='all';render()});document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!document.activeElement.isContentEditable){e.preventDefault();$('#search').focus()}if(e.key==='Escape'&&document.activeElement===$('#search')){$('#search').value='';query='';render()}});
$('#printguide').innerHTML='<h1>Skill desk</h1><p>Installed skills reference</p><p>Invoke a skill with $skill-name and a concrete task. Explicit means request it directly; automatic eligible means Codex may select it when relevant. This guide does not track active skills.</p>'+skills.map(s=>`<article><h2>${esc(s.id)}</h2><p class="meta">${esc(s.source)} · ${esc(s.category)} · ${esc(s.invocationLabel)}</p><p>${esc(s.summary)}</p><p><strong>Notice:</strong> ${esc(s.notice.join(' '))}</p><p><code>${esc(skillPrompt(s))}</code></p></article>`).join('');render();
</script></body></html>
